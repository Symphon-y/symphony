# Unmodified from upstream archiso's own releng profile. The `archiso` hook
# (from mkinitcpio-archiso, already in packages.x86_64) is what actually finds
# and mounts the live medium at boot -- without it, the initramfs falls back to
# normal root= resolution, which has nothing to find on a live medium.
HOOKS=(base udev microcode modconf kms memdisk archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs block filesystems keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
