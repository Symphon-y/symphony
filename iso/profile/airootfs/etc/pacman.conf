#
# /etc/pacman.conf for the booted live/install *environment* (Phase 13,
# corrected in Phase 14 after a real hardware pacstrap failure).
#
# This is a genuinely different file from ../../pacman.conf (profiledef.sh's
# pacman_conf): that one is build-time-only, used by mkarchiso to resolve
# packages.x86_64 into the airootfs, and is never consulted once the ISO is
# booted. This one becomes the live medium's real /etc/pacman.conf, and is
# what install/install-base-system's `pacstrap -K "$TARGET" ...` actually
# resolves the full packages/*.txt closure against.
#
# [localrepo] is populated at CI build time (release-iso.yml): every
# official-repo package packages/*.txt declares, pre-downloaded via
# `pacman -Syw`, plus the 3 AUR packages (yay, xdg-terminal-exec,
# bibata-cursor-theme-bin) built fresh via makepkg, all repo-add'ed into one
# database (as localrepo.db.tar.zst -- iso/build-offline-repo -- matching
# this section's name; pacman derives the expected database filename from
# the section name for a bare `Server = file://` URL). SigLevel = Optional
# TrustAll because locally-built/repackaged files aren't GPG-signed -- the
# Arch Wiki's own documented pattern for a custom local repository, not
# something invented here.
#
# [core]/[extra] are commented out, not "kept as a fallback" (that was
# this file's original, never-actually-tested claim): a real hardware
# pacstrap failure ("no servers configured for repository") showed that's
# not how pacman behaves. pacstrap's implicit `pacman -Sy` refreshes every
# ENABLED repo's database up front, and pacman aborts the WHOLE sync --
# including [localrepo], despite it being correctly configured and ranked
# first -- the instant ANY enabled repo has zero configured servers
# (confirmed from pacman's own source, lib/libalpm/be_sync.c:
# alpm_db_update() asserts db->servers != NULL per repo, in a loop that
# aborts the whole call on the first repo that fails). This ISO ships no
# /etc/pacman.d/mirrorlist, so core/extra always have zero servers here --
# left enabled they don't degrade gracefully, they take the entire install
# down. Matches the Arch Wiki's own documented practice for exactly this
# ("Offline installation": "Comment out core and extra so that pacman does
# not fail on the default repositories").
#
[options]
HoldPkg     = pacman glibc
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[localrepo]
SigLevel = Optional TrustAll
Server = file:///var/lib/autarchy-repo

#[core]
#Include = /etc/pacman.d/mirrorlist

#[extra]
#Include = /etc/pacman.d/mirrorlist
