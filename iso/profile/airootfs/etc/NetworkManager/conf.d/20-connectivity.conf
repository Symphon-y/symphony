# No connectivity check. NetworkManager's default (Arch ships this same file name
# under /usr/lib, which this one replaces) fetches http://ping.archlinux.org/
# nm-check.txt on every connection, which tells a third party your IP and when you
# connected -- at odds with this project's no-telemetry rule. Cost: NetworkManager
# can no longer detect captive-portal (hotel, airport) networks by itself.
#
# Kept byte-identical to system/networkmanager/20-connectivity.conf, which does the
# same for the installed system (a test enforces it: this profile can't symlink out).
[connectivity]
enabled=false
