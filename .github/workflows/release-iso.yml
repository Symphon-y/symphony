# Builds a bootable, fully offline-installable autarchy ISO from a tagged
# commit on main and publishes it as a GitHub Release (Phase 10, made
# offline-capable in Phase 13, made genuinely network-free in Phase 14 --
# Phase 13 baked in the *package* closure but not the *repo* driving the
# install, so the install still needed a GitHub clone; this workflow now
# bakes the repo itself in too). Own archiso profile (iso/profile/), no
# Omarchy code, no standing/continuously-operated package mirror (D-0050) --
# iso/build-offline-repo builds a local pacman repo fresh in this job, baked
# into the ISO, then discarded when the job ends.
#
# mkarchiso needs root/loop-device/squashfs capabilities archiso itself
# doesn't have on a plain ubuntu-latest runner, so the actual build runs
# inside a --privileged Arch container via `docker run` -- the same
# corroborated pattern real archiso-on-GitHub-Actions projects use
# (including Omarchy's own omarchy-iso, researched directly: same
# --privileged-container-plus-mkarchiso shape, though that project publishes
# through its own object storage rather than GitHub Releases).
name: release-iso

on:
  push:
    tags:
      - "20*.*.*" # date-based tags only, e.g. 2026.09.16

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    # 45 was cut close by a real run (Phase 14, 2026.09.17-test1): the
    # build itself finished around the 20-minute mark as usual, but
    # uploading the ~2.7 GB split ISO to the Release took longer than
    # usual on that runner and got killed by the timeout mid-upload.
    timeout-minutes: 70
    steps:
      # mkarchiso's offline-mirror-free build is still sizeable; the
      # runner's default free space is tight once Docker images and build
      # artifacts land alongside the toolcache.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          docker-images: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Baked into the ISO so scripts/update (post-install) knows the
      # installed release.
      - name: Record the release tag
        run: echo "${GITHUB_REF_NAME}" >iso/profile/airootfs/etc/autarchy-release

      # The core install needs the repo itself, not just the package cache
      # build-offline-repo populates below -- without this, autarchy-install
      # would still need a GitHub clone (Phase 14). Excludes:
      #   .git                    -- not needed to run install scripts
      #   iso/profile/airootfs    -- the destination lives under this path
      #                              (avoids copying into itself), and it's
      #                              where build-offline-repo is about to put
      #                              a ~1.4 GiB local package cache that has
      #                              no business being duplicated inside a
      #                              second, nested copy of the repo
      - name: Bake the repo into the live environment
        run: |
          mkdir -p iso/profile/airootfs/root/autarchy
          # .git is included (Phase 16): the installed target gets a real,
          # permanent, git-backed checkout copied from this, not just a
          # plain file tree -- 2.7 MB measured, no meaningful ISO-size cost.
          rsync -a --exclude='iso/profile/airootfs' \
            ./ iso/profile/airootfs/root/autarchy/

      - name: Disk space before the build
        run: df -h

      - name: Build the offline package repo and the ISO
        run: |
          docker run --rm --privileged \
            -v "$PWD:/workspace" -w /workspace \
            archlinux:latest \
            bash -c "/workspace/iso/build-offline-repo && \
                     mkarchiso -v -w /tmp/work -o /workspace/out iso/profile && \
                     chown -R $(id -u):$(id -g) /workspace/out"

      - name: Disk space after the build
        run: df -h

      - name: Rename and checksum the ISO
        id: iso
        run: |
          cd out
          iso=$(ls -- *.iso)
          mv -- "$iso" "autarchy-${GITHUB_REF_NAME}.iso"
          sha256sum "autarchy-${GITHUB_REF_NAME}.iso" >"autarchy-${GITHUB_REF_NAME}.iso.sha256"
          echo "size=$(stat -c%s "autarchy-${GITHUB_REF_NAME}.iso")" >>"$GITHUB_OUTPUT"

      # GitHub Releases refuses any single asset >= 2 GiB. Only decided here,
      # against the real built file's size -- not assumed in advance from the
      # ~2.5-2.8 GB estimate research produced (Phase 13), which turned out
      # to genuinely exceed the limit on the first real build
      # ("size must be less than 2147483648"). The .sha256 above is computed
      # over the whole, unsplit file, so `cat`-ing the parts back together
      # and checking it is how the runbook verifies a correct reassembly.
      - name: Split the ISO if it exceeds GitHub's 2 GiB per-file release limit
        if: fromJSON(steps.iso.outputs.size) >= 2147483648
        run: |
          cd out
          split -d -b 1800M --additional-suffix=.part \
            "autarchy-${GITHUB_REF_NAME}.iso" "autarchy-${GITHUB_REF_NAME}.iso."
          rm "autarchy-${GITHUB_REF_NAME}.iso"

      # Publishes with the gh CLI directly, not softprops/action-gh-release:
      # a real run (Phase 14, twice in a row -- 2026.09.17-test1 and
      # -test2) uploaded the tiny .sha256 instantly, then hung with zero
      # progress on the two multi-GB .iso.part files uploaded concurrently,
      # for the entire job timeout (45 min, then 70 min) both times. Not a
      # slow-network problem -- a dead stop, reproduced twice. gh uploads
      # assets one at a time (sidesteps whatever the action's concurrent
      # octokit upload was hitting), and each upload gets its own timeout
      # and a few retries with a short backoff, so a hang like this fails
      # fast with a clear error instead of silently eating the whole job's
      # budget again. A later real run (2026.09.17-test4) hit a second,
      # different failure this fixed-fast behavior caught immediately: a
      # genuine transient "HTTP 500: Error saving asset" from GitHub's own
      # upload API, twice in a row within seconds -- two attempts with no
      # delay between them wasn't enough to ride out a transient server
      # error, hence the backoff and the extra attempt.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          # --target: without this, gh defaults the release to the repo's
          # default branch (main) -- fine for a real release (always
          # tagged from main), but wrong for a tag pushed against any
          # other commit. Same real failure mode action-gh-release had
          # (D-0063 / phase-12.bats), same fix.
          gh release create "$GITHUB_REF_NAME" \
            --target "$GITHUB_SHA" \
            --generate-notes

          for f in autarchy-"$GITHUB_REF_NAME".iso*; do
            uploaded=false
            for attempt in 1 2 3; do
              if timeout 600 gh release upload "$GITHUB_REF_NAME" "$f" --clobber; then
                uploaded=true
                break
              fi
              echo "upload of $f timed out or failed (attempt $attempt/3) -- retrying in 20s" >&2
              sleep 20
            done
            "$uploaded" || {
              echo "upload of $f failed 3 times -- giving up" >&2
              exit 1
            }
          done
