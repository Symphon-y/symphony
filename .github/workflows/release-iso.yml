# Builds a bootable, fully offline-installable autarchy ISO from a tagged
# commit on main and publishes it as a GitHub Release (Phase 10, made
# offline-capable in Phase 13). Own archiso profile (iso/profile/), no
# Omarchy code, no standing/continuously-operated package mirror (D-0050) --
# iso/build-offline-repo builds a local pacman repo fresh in this job, baked
# into the ISO, then discarded when the job ends.
#
# mkarchiso needs root/loop-device/squashfs capabilities archiso itself
# doesn't have on a plain ubuntu-latest runner, so the actual build runs
# inside a --privileged Arch container via `docker run` -- the same
# corroborated pattern real archiso-on-GitHub-Actions projects use
# (including Omarchy's own omarchy-iso, researched directly: same
# --privileged-container-plus-mkarchiso shape, though that project publishes
# through its own object storage rather than GitHub Releases).
name: release-iso

on:
  push:
    tags:
      - "20*.*.*" # date-based tags only, e.g. 2026.09.16

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # mkarchiso's offline-mirror-free build is still sizeable; the
      # runner's default free space is tight once Docker images and build
      # artifacts land alongside the toolcache.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          docker-images: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Baked into the ISO so autarchy-bootstrap knows which tag to clone.
      - name: Record the release tag
        run: echo "${GITHUB_REF_NAME}" >iso/profile/airootfs/etc/autarchy-release

      - name: Disk space before the build
        run: df -h

      - name: Build the offline package repo and the ISO
        run: |
          docker run --rm --privileged \
            -v "$PWD:/workspace" -w /workspace \
            archlinux:latest \
            bash -c "/workspace/iso/build-offline-repo && \
                     mkarchiso -v -w /tmp/work -o /workspace/out iso/profile && \
                     chown -R $(id -u):$(id -g) /workspace/out"

      - name: Disk space after the build
        run: df -h

      - name: Rename and checksum the ISO
        id: iso
        run: |
          cd out
          iso=$(ls -- *.iso)
          mv -- "$iso" "autarchy-${GITHUB_REF_NAME}.iso"
          sha256sum "autarchy-${GITHUB_REF_NAME}.iso" >"autarchy-${GITHUB_REF_NAME}.iso.sha256"
          echo "size=$(stat -c%s "autarchy-${GITHUB_REF_NAME}.iso")" >>"$GITHUB_OUTPUT"

      # GitHub Releases refuses any single asset >= 2 GiB. Only decided here,
      # against the real built file's size -- not assumed in advance from the
      # ~2.5-2.8 GB estimate research produced (Phase 13), which turned out
      # to genuinely exceed the limit on the first real build
      # ("size must be less than 2147483648"). The .sha256 above is computed
      # over the whole, unsplit file, so `cat`-ing the parts back together
      # and checking it is how the runbook verifies a correct reassembly.
      - name: Split the ISO if it exceeds GitHub's 2 GiB per-file release limit
        if: fromJSON(steps.iso.outputs.size) >= 2147483648
        run: |
          cd out
          split -d -b 1800M --additional-suffix=.part \
            "autarchy-${GITHUB_REF_NAME}.iso" "autarchy-${GITHUB_REF_NAME}.iso."
          rm "autarchy-${GITHUB_REF_NAME}.iso"

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@6da8fa9354ddfdc4aeace5fc48d7f679b5214090 # v2.4.1
        with:
          # Without this, the action defaults to the repo's default branch
          # (main) as the release's target commit -- fine for a real release
          # (always tagged from main), but produces an inconsistent,
          # silently-parked-as-draft release when a tag is pushed against
          # any other commit (a real test-tag push hit this: GitHub showed
          # the release as draft, under an "untagged-<hash>" URL, despite
          # the build having succeeded). The exact commit the tag points to
          # is always correct.
          target_commitish: ${{ github.sha }}
          # One glob, not two: it already covers the checksum file, and a
          # separate literal path for it risked the same file being
          # resolved (and possibly uploaded) twice.
          files: out/autarchy-${{ github.ref_name }}.iso*
          generate_release_notes: true
