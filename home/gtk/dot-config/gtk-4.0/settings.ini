# Target: ~/.config/gtk-4.0/settings.ini (linked by install/link-home)
#
# GTK4/libadwaita ignores gtk-theme-name (no selectable theme engine any more), but
# still honors icon/cursor/font settings here. Colors come from the matugen-rendered
# gtk-4.0/gtk.css (@define-color overrides of libadwaita's named colors), the only
# user-level color lever libadwaita has.

[Settings]
gtk-icon-theme-name=Papirus-Dark
gtk-cursor-theme-name=Bibata-Modern-Classic
gtk-cursor-theme-size=24
gtk-font-name=JetBrainsMono Nerd Font 10
gtk-application-prefer-dark-theme=1
