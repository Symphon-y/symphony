# Target: ~/.config/gtk-3.0/settings.ini (linked by install/link-home)
#
# The parts of GTK theming that aren't palette-driven (icon/cursor theme, base font,
# dark preference). Colors themselves come from the matugen-rendered gtk.css
# (@define-color overrides), not from gtk-theme-name here.

[Settings]
gtk-icon-theme-name=Papirus-Dark
gtk-cursor-theme-name=Bibata-Modern-Classic
gtk-cursor-theme-size=24
gtk-theme-name=Adwaita-dark
gtk-font-name=JetBrainsMono Nerd Font 10
gtk-application-prefer-dark-theme=1
