# Target: ~/.config/wireplumber/wireplumber.conf.d/51-alsa-soft-mixer.conf
#
# Software volume/mute instead of the hardware mixer, which avoids quirks on some
# codecs (e.g. muffled audio on certain Realtek chips). Carried over from Phase 3's
# Omarchy research (ADAPT, D-0025) -- written against WirePlumber 0.5's current
# conf.d rule syntax, not the old Lua scripts Omarchy's own version used.

monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.*" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
