# Target: ~/.config/wireplumber/wireplumber.conf.d/52-bluetooth-a2dp-autoconnect.conf
#
# Auto-connect A2DP/HFP profiles on Bluetooth devices instead of requiring a manual
# reconnect after every pairing. Carried over from Phase 3's Omarchy research
# (ADAPT, D-0025).

monitor.bluez.rules = [
  {
    matches = [
      { device.name = "~bluez_card.*" }
    ]
    actions = {
      update-props = {
        bluez5.auto-connect = "[ a2dp_sink a2dp_source hfp_hf hsp_hs ]"
      }
    }
  }
]
