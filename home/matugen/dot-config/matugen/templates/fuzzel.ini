# Generated by matugen from ~/.config/matugen/config.toml into ~/.config/fuzzel/fuzzel.ini.
# Edit this template, not the generated file -- it gets overwritten on every render.

[main]
font=monospace:size=11
dpi-aware=auto
width=40
lines=8

[colors]
background={{ colors.background.default.hex_alpha_stripped }}
text={{ colors.on_background.default.hex_alpha_stripped }}
match={{ colors.primary.default.hex_alpha_stripped }}
selection={{ colors.surface_variant.default.hex_alpha_stripped }}
selection-text={{ colors.on_surface_variant.default.hex_alpha_stripped }}
selection-match={{ colors.primary.default.hex_alpha_stripped }}
border={{ colors.primary.default.hex_alpha_stripped }}

[border]
width=2
radius=6

# No [dmenu] exit-immediately-if-empty: networkmanager-dmenu asks for a Wi-Fi
# password through fuzzel with an empty list, and fuzzel would quit on the spot,
# leaving an empty password (D-0075).
