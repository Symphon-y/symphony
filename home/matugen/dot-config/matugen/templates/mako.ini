# Generated by matugen from ~/.config/matugen/config.toml into ~/.config/mako/config.
# Edit this template, not the generated file -- it gets overwritten on every render.

anchor=top-right
width=380
margin=10
padding=10
border-size=2
border-radius=8
default-timeout=5000
font=sans-serif 11

background-color={{ colors.background.default.hex }}
text-color={{ colors.on_background.default.hex }}
border-color={{ colors.primary.default.hex }}

[urgency=critical]
border-color={{ colors.error.default.hex }}
default-timeout=0

# Update offers (Phase 20): clicking has to invoke the action, or the "Update now"
# button does nothing at all -- mako's default for a left click is to dismiss. Long
# enough to read and answer; the waybar badge is what persists, so this is not
# urgency=critical, whose red border above is for failures.
[app-name=symphony]
on-button-left=invoke-default-action
default-timeout=30000
