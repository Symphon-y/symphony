# Generated by matugen from ~/.config/matugen/config.toml into ~/.config/mako/config.
# Edit this template, not the generated file -- it gets overwritten on every render.

anchor=top-right
width=380
margin=10
padding=10
border-size=2
border-radius=8
default-timeout=5000
font=sans-serif 11

background-color={{ colors.background.default.hex }}
text-color={{ colors.on_background.default.hex }}
border-color={{ colors.primary.default.hex }}

[urgency=critical]
border-color={{ colors.error.default.hex }}
default-timeout=0

# Update offers (Phase 20). Only the timeout is set here: mako already runs
# invoke-default-action on a left click, and it draws no buttons for actions, so the
# toast is plain text you click. Long enough to read and answer; the waybar badge is
# what persists, so this is not urgency=critical, whose red border above is for
# failures.
[app-name=symphony]
default-timeout=30000
