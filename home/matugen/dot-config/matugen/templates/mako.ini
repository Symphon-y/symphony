# Generated by matugen from ~/.config/matugen/config.toml into ~/.config/mako/config.
# Edit this template, not the generated file -- it gets overwritten on every render.

anchor=top-right
width=380
margin=10
padding=10
border-size=2
border-radius=8
default-timeout=5000
font=sans-serif 11

background-color={{ colors.background.default.hex }}
text-color={{ colors.on_background.default.hex }}
border-color={{ colors.primary.default.hex }}

[urgency=critical]
border-color={{ colors.error.default.hex }}
default-timeout=0
