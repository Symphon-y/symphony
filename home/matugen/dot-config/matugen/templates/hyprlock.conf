# Generated by matugen from ~/.config/matugen/config.toml into ~/.config/hypr/hyprlock.conf.
# Edit this template, not the generated file -- it gets overwritten on every render.

background {
    monitor =
    color = {{ colors.background.default.rgba }}
    blur_passes = 2
}

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 3
    inner_color = {{ colors.surface.default.rgba }}
    outer_color = {{ colors.primary.default.rgba }}
    font_color = {{ colors.on_surface.default.rgba }}
    fail_color = {{ colors.error.default.rgba }}
    placeholder_text = <i>Password...</i>
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = {{ colors.on_background.default.rgba }}
    font_size = 64
    position = 0, 160
    halign = center
    valign = center
}
