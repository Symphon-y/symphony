# Generated by matugen from ~/.config/matugen/config.toml into ~/.config/ghostty/config.
# Edit this template, not the generated file -- it gets overwritten on every render.
# Font and other non-color settings are Phase 6's job (fonts/GTK/Qt/icons/cursors).

cursor-style = block
cursor-style-blink = false

background = {{ colors.background.default.hex }}
foreground = {{ colors.on_background.default.hex }}
selection-background = {{ colors.primary.default.hex }}
selection-foreground = {{ colors.on_primary.default.hex }}
