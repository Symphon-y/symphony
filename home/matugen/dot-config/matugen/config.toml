# Target: ~/.config/matugen/config.toml (linked by install/link-home)
#
# Phase 4 wired in a placeholder palette (a hardcoded seed color) to prove the
# pipeline; Phase 5 added fuzzel and waybar. Phase 6 makes the palette real: the
# wallpaper IS the palette source (no named-theme library -- D-0025's Phase 6
# revision), re-derived live by `wallpaper-set`/`wallpaper-random`
# (home/hyprpaper/dot-local/bin/) via `matugen image <path>` every time it changes.
#
# Manual re-render (e.g. after editing a template): matugen image
# ~/.local/share/backgrounds/current.png --source-color-index 0
# `matugen color hex "#1e1e2e"` still works too (any seed color, not just an image).
#
# Output paths are absolute (~/...), not relative to this file: config.toml is a
# stow symlink, and matugen resolves relative paths against the symlink's real
# target inside the repo checkout, not $HOME -- a relative output_path would write
# generated files into the git working tree instead of the actual app configs.
# (Confirmed empirically: matugen does expand ~ in paths.) Template input_path stays
# relative, since the template sources genuinely live next to this file either way.

[config]
fallback_color = "#1e1e2e"

[templates.mako]
input_path = "./templates/mako.ini"
output_path = "~/.config/mako/config"
post_hook = "makoctl reload || true"

[templates.hyprlock]
input_path = "./templates/hyprlock.conf"
output_path = "~/.config/hypr/hyprlock.conf"

[templates.ghostty]
input_path = "./templates/ghostty.conf"
output_path = "~/.config/ghostty/config"

[templates.fuzzel]
input_path = "./templates/fuzzel.ini"
output_path = "~/.config/fuzzel/fuzzel.ini"

[templates.waybar]
input_path = "./templates/waybar.css"
output_path = "~/.config/waybar/colors.css"
post_hook = "pkill -SIGUSR2 waybar || true"

[templates.gtk3]
input_path = "./templates/gtk3.css"
output_path = "~/.config/gtk-3.0/gtk.css"

[templates.gtk4]
input_path = "./templates/gtk4.css"
output_path = "~/.config/gtk-4.0/gtk.css"

[templates.theme_env]
input_path = "./templates/theme.env"
output_path = "~/.config/symphony/theme.env"
