<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Target: ~/.config/fontconfig/fonts.conf (linked by install/link-home)

     The canonical source of truth for "which font": everything that asks for the
     generic `monospace` family (terminal, waybar, fuzzel) gets JetBrainsMono Nerd
     Font, including its glyph coverage for waybar's workspace/audio/network icons
     (previously rendered as empty boxes with no Nerd Font installed at all). Same
     mechanism Omarchy uses (docs/omarchy-influences.md, "Fonts, GTK/Qt, icons,
     cursors"), adopted as is. -->
<fontconfig>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
    </prefer>
  </alias>
</fontconfig>
