# Target: ~/.config/networkmanager-dmenu/config.ini (linked by install/link-home)
#
# networkmanager-dmenu supports fuzzel natively (--dmenu for the list). Named
# explicitly rather than left to its auto-detection, which picks the first launcher
# it finds.
[dmenu]
dmenu_command = fuzzel

# Without this, networkmanager-dmenu does not pass fuzzel --password, and a Wi-Fi
# password is shown in plain text as it is typed (the default is False).
[dmenu_passphrase]
obscure = True
