# Target: ~/.tmux.conf (linked by install/link-home)
#
# Why tmux on a text console: the Linux kernel console has no scrollback (removed in
# Linux 5.9) and no clipboard. tmux provides both, plus windows to keep Claude Code and
# an admin shell side by side.

# Claude Code sessions produce long output; keep plenty of it.
set -g history-limit 50000

# Pass Escape through quickly, so full-screen terminal programs react at once.
set -g escape-time 10
