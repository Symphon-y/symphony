# Target: ~/.config/hypr/hyprpaper.conf (linked by install/link-home)
#
# A generated solid-color placeholder (~/.local/share/backgrounds/placeholder.png) --
# proves the mechanism works. Curated wallpapers are Phase 6's job (single palette
# source -> component themes, including wallpapers).

preload = ~/.local/share/backgrounds/placeholder.png
wallpaper = ,~/.local/share/backgrounds/placeholder.png
ipc = on
splash = false
