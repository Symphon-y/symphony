# Target: ~/.config/hypr/hyprpaper.conf (linked by install/link-home)
#
# Always points at ~/.local/share/backgrounds/current.png -- a symlink `wallpaper-set`
# repoints at runtime, so the same static config keeps working across logins no matter
# what the user last chose. Phase 4's `preload =` / flat `wallpaper = mon,path` lines
# were the *old* hyprpaper config syntax; the version installed here (0.8.4+) parses
# `wallpaper` as a block special-category and silently ignores unknown flat keys --
# confirmed live: the old lines produced no error but also rendered nothing
# (`Monitor Virtual-1 has no target: no wp will be created` in the journal, and
# `hyprctl hyprpaper listactive` came back empty). This block form is the real,
# current syntax (verified against hyprpaper's own source, src/config/ConfigManager.cpp
# and WallpaperMatcher.cpp).

wallpaper {
  monitor = *
  path = ~/.local/share/backgrounds/current.png
  fit_mode = cover
}

ipc = on
splash = false
