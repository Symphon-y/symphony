# Target: ~/.config/hypr/hypridle.conf (linked by install/link-home)
#
# hyprlang syntax (hypridle is a separate ecosystem tool from Hyprland itself, and
# wasn't part of Hyprland's own move to Lua config).

general {
    lock_cmd = hyprlock
    before_sleep_cmd = hyprlock
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300
    on-timeout = hyprlock
}

listener {
    timeout = 600
    on-timeout = systemctl suspend
}
