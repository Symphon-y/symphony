# Target: /etc/ssh/sshd_config.d/10-autarchy.conf
#
# SSH exists for one purpose: an administrator session from a trusted jump host (for
# the lab VM, Unraid's web terminal), started on demand. So: keys only, no root, and
# no forwarding of agents, ports, X11, or tunnels.
#
# Arch's sshd_config includes sshd_config.d/*.conf before its own settings, and sshd
# keeps the first value it reads for a keyword, so this file wins over the packaged
# 99-archlinux.conf.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AuthenticationMethods publickey

# Authorized keys are root-owned system config, installed by install/sync-system from
# system/hosts/<hostname>/, so the user account, or an agent running as it, can't
# grant itself SSH access.
AuthorizedKeysFile /etc/ssh/authorized_keys/%u

AllowAgentForwarding no
AllowTcpForwarding no
X11Forwarding no
PermitTunnel no
