# Target: /etc/xdg/reflector/reflector.conf (installed by install/sync-system)
#
# Run by the package's own reflector.service/reflector.timer (enabled via
# system/services-root.txt + install/enable-root-services, Phase 9). Country
# inferred from this machine's configured timezone (America/Chicago -> United
# States) rather than left at the package's own multi-country default -- easy
# to change here if the machine ever moves.

--save /etc/pacman.d/mirrorlist
--protocol https
--country "United States"
--latest 5
--sort rate
