# Target: /etc/systemd/zram-generator.conf
#
# Swap on compressed RAM: headroom under memory pressure without a swap partition
# to size, encrypt, or wear out. Half of RAM, capped at 8 GiB.
# No hibernation, since that needs disk-backed swap (revisit on laptops, Phase 10).
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
