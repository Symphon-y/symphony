# Target: /etc/systemd/resolved.conf.d/10-symphony.conf
#
# Turn off link-local name resolution. LLMNR and multicast DNS make
# systemd-resolved listen on every interface and answer name queries from the
# LAN. A workstation has nothing to advertise, and spoofed LLMNR answers are a
# well-known way to phish credentials. Ordinary DNS is unaffected.
[Resolve]
LLMNR=no
MulticastDNS=no
