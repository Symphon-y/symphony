# Target: /etc/sddm.conf.d/10-wayland.conf (installed by install/sync-system)
#
# Enables Wayland session support. No forced default/autologin session: whichever
# wayland-sessions .desktop file the hyprland package installs shows up in the
# greeter's own session picker, so this doesn't need to guess or hardcode its name.

[General]
DisplayServer=wayland
