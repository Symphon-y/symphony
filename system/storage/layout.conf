# Storage layout constants shared by the install runbook and the acceptance tests.
# Sourced by bash. Portable across machines: which disk to install to is chosen
# per install (docs/runbooks/base-install.vars.example), never here.

# GPT partition labels, so no command ever depends on partition numbering.
ESP_PARTLABEL=ESP
LUKS_PARTLABEL=cryptroot
# Only created when SWAP_SIZE is set in a given install's vars file (Phase 12) --
# a dedicated hibernation-capable swap partition, not the default.
SWAP_PARTLABEL=cryptswap

# 2 GiB holds UKIs for two kernels plus their fallback images, with headroom.
ESP_SIZE=2G

# The ESP is mounted at /efi, not /boot. Kernel images in /boot then stay inside
# the btrfs root and are snapshotted together with their modules; only the UKIs
# (rebuilt from them by mkinitcpio) live on the ESP.
ESP_MOUNT=/efi

LUKS_MAPPER=root
BTRFS_LABEL=arch

# noatime: no metadata write on every read (expensive once snapshots share extents).
# compress=zstd:1: cheap compression that usually saves both space and I/O.
BTRFS_MOUNT_OPTS=noatime,compress=zstd:1
