#!/usr/bin/nft -f
# Target: /etc/nftables.conf
#
# A workstation offers no network services, so nothing is accepted inbound except
# replies to connections this machine started. Outbound traffic is unrestricted;
# egress filtering is not a goal yet.

flush ruleset

table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;

    ct state established,related accept
    ct state invalid drop
    iifname "lo" accept

    # ICMP carries errors TCP depends on (e.g. "fragmentation needed"), and ICMPv6
    # neighbor discovery is how IPv6 finds routers and neighbors at all.
    meta l4proto icmp accept
    meta l4proto ipv6-icmp accept

    # DHCPv6 server replies arrive from link-local addresses and are not tracked
    # as replies by conntrack.
    ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}

# Machine-local rules that never enter git, for example the one jump host allowed to
# reach sshd (written by install/ssh-jump-host). Having no matching files is not an
# error (nft(8), INCLUDE FILES).
include "/etc/nftables.d/*.nft"
