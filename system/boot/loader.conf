# Target: /efi/loader/loader.conf
#
# default: boot the mainline kernel unless another entry is picked.
# timeout: long enough to choose linux-lts or a fallback image when recovering.
# editor no: editing the kernel command line at the menu lets anyone at the
#   console boot into a root shell (init=/bin/sh) and bypass every password.
default arch-linux.efi
timeout 3
console-mode keep
editor no
