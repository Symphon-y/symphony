# Target: /etc/mkinitcpio.conf.d/10-symphony.conf
#
# systemd-based initramfs. sd-encrypt unlocks LUKS using the rd.luks.* options in
# /etc/kernel/cmdline, which mkinitcpio embeds in every UKI. sd-vconsole applies
# /etc/vconsole.conf so the passphrase prompt uses the configured keymap.
#
# A drop-in instead of an edited /etc/mkinitcpio.conf keeps the packaged file
# untouched, so package updates never produce a conflicting .pacnew.
HOOKS=(base systemd autodetect microcode modconf kms keyboard sd-vconsole block sd-encrypt filesystems fsck)
