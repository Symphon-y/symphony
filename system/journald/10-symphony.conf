# Target: /etc/systemd/journald.conf.d/10-symphony.conf (installed by install/sync-system)
#
# journald self-limits by a large compiled-in default (roughly 10% of the
# filesystem hosting /var/log/journal) even with zero config -- this replaces
# that with an explicit, reasoned cap instead of an implicit one. Vacuuming is a
# boundary journald enforces continuously as it writes, not a periodic job, so
# this is a drop-in, not a timer.

[Journal]
SystemMaxUse=500M
